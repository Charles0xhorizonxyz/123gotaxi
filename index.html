<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>123go.taxi</title>
    <meta
      name="description"
      content="Turn an address into a QR code your taxi driver can scan to start navigation in their own app."
