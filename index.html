<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>123go.taxi</title>
    <meta
      name="description"
      content="Turn any destination into a QR code your taxi driver can scan. Free and open source."
    />
    <!-- Link previews (LinkedIn, WhatsApp, X…). Crawlers don't run JavaScript, so these stay static. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://123go.taxi/" />
    <meta property="og:site_name" content="123go.taxi" />
    <meta property="og:title" content="123go.taxi: Set a place. Get a QR. Go!" />
    <meta
      property="og:description"
      content="Turn any destination into a QR code your taxi driver can scan. Free and open source."
    />
    <meta property="og:image" content="https://123go.taxi/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffc61a" />
    <!-- Apps opened from the driver screen aren't told which page sent them. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- "Install" / "Add to Home Screen" -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <main id="app"></main>
    <noscript>123go.taxi needs JavaScript to build your QR code.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
